<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>NOCTA · etiquetas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213D;--cream:#F3EFE6;--mm:5px}body{margin:0;background:#dcdcdc;font-family:Inter,Arial,sans-serif;color:var(--navy);padding:30px}
.label{position:relative;background:var(--cream);outline:1px dashed #b00;box-sizing:border-box;padding:calc(4*var(--mm));display:flex;flex-direction:column;margin-bottom:40px}
.label.navy{background:var(--navy);color:var(--cream)}
.wm{font-weight:700;letter-spacing:-.04em;line-height:1}.cap{letter-spacing:.14em;font-weight:500}
.tiny{font-size:calc(1.6*var(--mm));line-height:1.3}.small{font-size:calc(2*var(--mm));line-height:1.35}
.meta{font-size:10px;color:#b00;margin:-6px 0 14px}
.moon{width:calc(5*var(--mm));height:calc(5*var(--mm))}
.row{display:flex;gap:calc(3*var(--mm))}
.bars{height:calc(8*var(--mm));width:calc(28*var(--mm));background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 3px,currentColor 3px 4px,transparent 4px 7px,currentColor 7px 9px,transparent 9px 10px)}
.sym span{border:1px solid currentColor;border-radius:50%;width:calc(5*var(--mm));height:calc(5*var(--mm));display:inline-flex;align-items:center;justify-content:center;font-size:calc(1.8*var(--mm));margin-right:4px}
</style></head><body>
<script>
fetch('specs.json').then(r=>r.json()).then(S=>{const B=S.brand;
const moon=c=>`<svg class="moon" viewBox="0 0 24 24" fill="${c}"><path d="M15 3a9 9 0 1 0 6 15.5A8 8 0 0 1 15 3z"/></svg>`;
S.labels.forEach(l=>{const navy=l.id==='exfoliante';const ink=navy?'#F3EFE6':'#14213D';
const el=document.createElement('div');el.className='label'+(navy?' navy':'');el.style.width=`calc(${l.label_w}*var(--mm))`;el.style.height=`calc(${l.label_h}*var(--mm))`;
el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="wm" style="font-size:calc(7*var(--mm))">nocta</div>${moon(ink)}</div>
<div style="margin-top:auto"><div class="cap" style="font-size:calc(2.6*var(--mm))">${l.name}</div><div class="cap" style="font-size:calc(2.2*var(--mm));opacity:.9">${l.sub}</div><div class="small" style="margin-top:calc(1*var(--mm))">${l.claim}</div></div>
<div class="row" style="margin-top:calc(2*var(--mm));align-items:flex-end"><div class="tiny" style="flex:1"><b>Modo de uso:</b> ${l.how}<br><b>Ingredientes:</b> ${l.inci}<br><b>Precauciones:</b> ${l.warn}<br>${B.rp}<br>${B.origin} · Lote/Cad.: ver envase</div><div style="text-align:right"><div style="font-size:calc(3*var(--mm));font-weight:700">${l.vol}</div><div class="sym" style="margin:4px 0"><span>${l.pao}</span><span>♻</span><span>Ⓥ</span></div><div class="bars"></div><div class="tiny" style="font-family:monospace">${l.ean}</div></div></div>`;
const m=document.createElement('div');m.className='meta';m.innerHTML=`<b>${l.sku} · ${l.name} ${l.sub}</b> — etiqueta ${l.label_w} × ${l.label_h} mm · envase: ${l.container} · escala 1 mm = 5 px · sangre 2 mm · papel: polipropileno blanco mate + laminado, adhesivo permanente resistente a humedad`;
document.body.appendChild(m);document.body.appendChild(el);});});
</script></body></html>
