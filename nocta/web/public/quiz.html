<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test de piel: ¿qué parche necesitas? · NOCTA</title>
<meta name="description" content="4 preguntas para saber qué parche NOCTA necesita tu piel: nariz, zona T, granos o una rutina completa.">
<link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#FAF8F3">
<script src="/assets/js/app.js" defer></script>
</head>
<body>
<div id="site-header"><div class="n-top-ph"></div></div>
<main class="n-wrap n-wrap--text" id="main">
  <div class="n-flow">
    <button class="n-icon" id="qback" aria-label="Atrás" hidden></button>
    <span class="n-lab">Test de piel</span>
    <a class="n-icon" href="/" id="qexit" aria-label="Salir"></a>
  </div>
  <div id="q"></div>
</main>
<div id="site-footer"></div>
<script src="/assets/js/products.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const QS=[
{q:"¿Dónde te preocupa más tu piel?",a:[["Nariz: puntitos oscuros y brillo","nariz"],["Frente y barbilla: grasa y granitos","tzone"],["Granos que aparecen y desaparecen","granos"],["Textura apagada, poros por toda la cara","textura"]]},
{q:"¿Qué has probado ya?",a:[["Tiras de poros","tiras"],["Apretar o scrubs","apretar"],["Cremas con ácidos","acidos"],["Nada aún","nada"]]},
{q:"¿Cómo está tu piel a media tarde?",a:[["Brilla en la zona T","grasa"],["Brilla en toda la cara","muygrasa"],["Normal","normal"],["Tirante o seca","seca"]]},
{q:"¿Cuánto tiempo quieres dedicarle?",a:[["Casi nada: ponérmelo y dormir","min"],["2 pasos por la noche, sin problema","dos"],["Una rutina completa","full"]]}
];
let i=0,ans=[],view='q';
const box=document.getElementById('q'),back=document.getElementById('qback');
document.getElementById('qexit').innerHTML=nIco('x',22);
back.innerHTML=nIco('back',22);

function reco(){const [zona,prev,piel,tiempo]=ans;let main='parches-nariz',plus=null,name='Poros limpios';
if(zona==='tzone')main='kit-t-zone';if(zona==='granos')main='parches-granos';if(zona==='textura')main='kit-cara-completa';
if(zona==='nariz'&&(tiempo!=='min'||piel==='muygrasa'))main='duo-poros';
if(tiempo==='full')plus='serum-niacinamida';else if(zona==='granos')plus='parches-superficie';else if(main==='parches-nariz')plus='exfoliante-salicilico';
return {main,plus,skin:zona+'/'+piel};}

function draw(){
  back.hidden = view==='result' || (view==='q'&&i===0);
  if(view==='q'){
    const s=QS[i];
    box.innerHTML=`<div class="n-progress"><i style="width:${i/QS.length*100}%"></i></div><p class="n-lab">Pregunta ${i+1} de ${QS.length}</p><h2 class="n-d3">${s.q}</h2><div class="n-ans">${s.a.map(a=>`<button data-v="${a[1]}">${a[0]}${nIco('chev',18)}</button>`).join('')}</div>`;
    box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      ans.push(b.dataset.v);nTrack('quiz_answer',{q:i,a:b.dataset.v});i++;
      view = i>=QS.length ? 'email' : 'q';
      draw();
    });
  }else if(view==='email'){
    const r=reco();
    box.innerHTML=`<div class="n-progress"><i style="width:100%"></i></div><h2 class="n-d3">Ya tenemos tu rutina</h2><p class="n-lead">Déjanos tu email para guardarla y enviarte un <b>10 % de descuento</b> para tu primer pedido.</p><form class="n-form" id="qf"><label for="q-email" class="n-vh">Email</label><input id="q-email" name="email" type="email" required placeholder="tu@email.com" autocomplete="email"><button class="n-btn n-btn--wide">Ver mi rutina y mi −10 %</button></form><button class="n-link" id="skip" style="margin-top:10px">Ver sin dejar email</button>`;
    document.getElementById('qf').onsubmit=e=>{
      e.preventDefault();const em=document.getElementById('q-email').value;
      fetch('/api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em,src:'quiz',skin:r.skin})}).catch(()=>{});
      sessionStorage.setItem('n_disc',JSON.stringify({code:'HOLA10',type:'pct',value:10}));
      localStorage.setItem('n_popup','1');
      nTrack('lead',{src:'quiz',skin:r.skin});
      view='result';result(r,true);
    };
    document.getElementById('skip').onclick=()=>{view='result';result(r,false);};
  }
}
function goBack(){
  if(view==='email'){ans.pop();i=QS.length-1;view='q';draw();return;}
  if(view==='q'&&i>0){ans.pop();i--;draw();}
}
back.onclick=goBack;

function result(r,disc){
  const m=nBySlug(r.main),p=r.plus&&nBySlug(r.plus);
  nTrack('quiz_result',{main:r.main,plus:r.plus,skin:r.skin});
  back.hidden=true;
  const cta=(pp,src)=>`<div class="n-cta"><div class="n-cut"><img src="${nImg(pp)}" width="96" height="96" alt="" loading="lazy"></div><div class="n-cta__t"><span class="n-lab">${nCat(pp)}</span><b>${pp.name}</b><p class="n-price" style="margin-top:4px"><b class="n-num">${nEur(pp.price)}</b>${pp.compare?`<s>${nEur(pp.compare)}</s>`:''}</p></div>${nBuyBlock(pp.slug,{src})}</div>`;
  const mini=(pp,src)=>`<div class="n-mini"><div class="n-cut"><img src="${nImg(pp)}" width="72" height="72" alt="" loading="lazy"></div><div class="n-mini__t"><span class="n-lab">${nCat(pp)}</span><b>${pp.name}</b><small>${pp.short}</small></div><div class="n-mini__a"><button class="n-btn n-btn--sm" data-buy="${pp.slug}" data-src="${src}">Comprar ahora</button>${nPay(pp.slug,{src})}<button class="n-link" data-add="${pp.slug}" data-src="${src}">Añadir</button></div></div>`;
  box.innerHTML=`<span class="n-lab">Tu rutina</span><h2 class="n-d3">Esto es lo que más te va a cambiar la piel</h2><p class="n-lead">Según tus respuestas (${ans.join(', ')}).</p>
  ${cta(m,'quiz')}
  ${disc?'<p class="n-sm n-muted">Código HOLA10 aplicado: −10 % en el checkout.</p>':''}
  ${p?mini(p,'quiz'):''}
  <div id="quiztrust" style="margin-top:var(--n-s4)"></div>
  <button class="n-btn n-btn--ghost n-btn--wide" id="tocart" style="margin-top:var(--n-s4)">Ir al carrito</button>`;
  document.getElementById('quiztrust').innerHTML=nTrust();
  document.getElementById('tocart').onclick=()=>nCart.open();
}
nTrack('quiz_start');draw();
});
</script>
</body>
</html>
