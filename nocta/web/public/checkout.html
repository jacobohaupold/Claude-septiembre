<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Finalizar compra · NOCTA</title>
<meta name="description" content="Finaliza tu pedido NOCTA: datos de envío y pago seguro con tarjeta, Bizum, Klarna o PayPal.">
<link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css?v=202609090244">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#FAF8F3">
<script src="/assets/js/app.js?v=202609090244" defer></script>
</head>
<body class="n-v5 n-checkout">
<div id="site-header"><div class="n-top-ph"></div></div>
<main class="n-wrap n-wrap--text" id="main">
  <p style="text-align:center;margin:14px 0 0"><span class="n-lab">Pago seguro</span></p>
  <p style="text-align:center;margin:4px 0 20px"><span class="n-lab">Paso 1 de 2 · Datos y pago</span></p>

  <details class="n-sumfold">
    <summary>Tu pedido <b class="n-num" id="sumfoldtot">0,00 €</b></summary>
    <div>
      <div id="sum"></div>
      <div id="sumtot"></div>
      <div id="cartupsell" style="margin-top:12px"></div>
      <p class="n-sm n-muted" style="margin-top:10px"><span id="giftmsg"></span></p>
    </div>
  </details>

  <div id="expresspay"></div>
  <div class="n-pay-div">o rellena tus datos</div>

  <form class="n-form" id="cof">
    <label for="f-email">Email</label>
    <input id="f-email" name="email" type="email" required placeholder="tu@email.com" autocomplete="email" enterkeyhint="next">
    <div class="n-row">
      <div><label for="f-name">Nombre</label><input id="f-name" name="name" required autocomplete="given-name" enterkeyhint="next"></div>
      <div><label for="f-last">Apellidos</label><input id="f-last" name="last" required autocomplete="family-name" enterkeyhint="next"></div>
    </div>
    <label for="f-address">Dirección</label>
    <input id="f-address" name="address" required placeholder="Calle, número, piso" autocomplete="street-address" enterkeyhint="next">
    <div class="n-row">
      <div><label for="f-zip">Código postal</label><input id="f-zip" name="zip" required pattern="[0-9]{4,5}" inputmode="numeric" autocomplete="postal-code" enterkeyhint="next"></div>
      <div><label for="f-city">Ciudad</label><input id="f-city" name="city" required autocomplete="address-level2" enterkeyhint="next"></div>
    </div>
    <div class="n-row">
      <div><label for="f-country">País</label><select id="f-country" name="country" autocomplete="country"><option value="ES">España</option><option value="PT">Portugal</option></select></div>
      <div><label for="f-phone">Teléfono (para el transportista)</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" enterkeyhint="done"></div>
    </div>

    <details class="n-sumfold" style="margin-top:var(--n-s4)">
      <summary>¿Tienes un código de descuento?</summary>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <div style="flex:1"><label for="f-code" class="n-vh">Código de descuento</label><input id="f-code" name="code" placeholder="HOLA10" autocomplete="off"></div>
        <button type="button" class="n-btn n-btn--ghost n-btn--sm" id="applycode" style="min-height:44px">Aplicar</button>
      </div>
    </details>

    <h2 style="margin-top:24px">Pago</h2>
    <div class="n-methods">
      <label class="is-on"><input type="radio" name="pay" value="card" checked>Tarjeta · Visa, Mastercard, Apple Pay y Google Pay</label>
      <label><input type="radio" name="pay" value="bizum">Bizum</label>
      <label><input type="radio" name="pay" value="klarna">Klarna · 3 plazos sin intereses</label>
      <label><input type="radio" name="pay" value="paypal">PayPal</label>
    </div>

    <label class="n-check"><input type="checkbox" required>Acepto las <a href="/legal.html">condiciones y la política de privacidad</a></label>

    <p class="n-xs n-muted" id="subnotice" hidden></p>

    <button class="n-btn n-btn--wide n-btn--lg" id="paybtn" data-bbar-anchor aria-describedby="subnotice" style="margin-top:14px">Pagar de forma segura</button>
    <p class="n-xs n-muted" style="text-align:center;margin-top:8px">Serás redirigido a la pasarela segura de pago (Stripe). Garantía 60 días · Devolución 14 días sin abrir.</p>
  </form>
  <div id="checktrust" style="margin-top:8px"></div>
</main>

<div class="n-bbar" id="sticky" role="region" aria-label="Pagar">
  <div class="n-wrap n-bbar__in">
    <div class="n-bbar__i"><b>Total</b><span class="n-lab n-num" id="bbartot">0,00 €</span></div>
    <button class="n-btn n-btn--sm" id="bbarpay" type="button">Pagar</button>
  </div>
</div>

<div id="site-footer"></div>
<script src="/assets/js/products.js?v=202609090244"></script><script src="/api/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('checktrust').innerHTML=nTrust();
document.getElementById('expresspay').innerHTML=nPay(null,{cart:true,src:'checkout'});
const render=()=>{
  const t=nCart.totals();
  document.getElementById('sum').innerHTML=t.items.map(i=>{const p=nBySlug(i.slug);const u=p.plan?p.price:(i.sub?p.sub:p.price);return `<div class="n-line"><div class="n-cut"><img src="${nImg(p)}" width="64" height="64" alt="" loading="lazy"></div><div class="n-line__t"><b>${p.name}${i.opt?' · '+i.opt:''}${p.plan?' <span class="n-lab">'+p.plan.every+'</span>':''}</b><small>${i.qty} × ${nEur(u)}${i.sub?' · Suscripción':''}</small></div><div class="n-line__p"><b class="n-num">${nEur(u*i.qty)}</b></div></div>`;}).join('')
    +t.gifts.map(g=>`<div class="n-line n-line--gift"><div class="n-line__t"><span class="n-lab n-lab--navy">Regalo</span><b>${g.label}</b></div><b class="n-num">0,00 €</b></div>`).join('');
  document.getElementById('sumtot').innerHTML=`<div class="n-sums"><div><span>Subtotal</span><span class="n-num">${nEur(t.sub)}</span></div>${t.dAmt?`<div class="ok"><span>Código ${t.disc.code}</span><span class="n-num">−${nEur(t.dAmt)}</span></div>`:''}<div><span>Envío</span><span class="n-num">${t.ship?nEur(t.ship):'Gratis'}</span></div></div><div class="n-tot"><span>Total</span><span class="n-num">${nEur(t.total)}</span></div>`;
  document.getElementById('sumfoldtot').textContent=nEur(t.total);
  document.getElementById('bbartot').textContent=nEur(t.total);
  const next=window.NOCTA_GIFTS.find(g=>t.sub-t.dAmt<g.threshold);
  document.getElementById('giftmsg').textContent=next?`Añade ${nEur(next.threshold-(t.sub-t.dAmt))} más y consigue: ${next.label}`:'Todos los regalos desbloqueados';
  const sub=document.getElementById('subnotice');const planItems=t.items.filter(i=>nBySlug(i.slug).plan);const subItems=t.items.filter(i=>i.sub&&!nBySlug(i.slug).plan);
  if(planItems.length){sub.textContent=planItems.map(i=>{const p=nBySlug(i.slug);return `${p.name}: ${nEur(p.price)} ${p.plan.every}`;}).join(' · ')+'. Hoy se cobra el primer envío; después, el mismo día de cada periodo. Cancela o pausa desde el email de cada envío. Solo tarjeta en planes.';sub.hidden=false;}else
  if(subItems.length){const subTotal=subItems.reduce((a,i)=>a+nBySlug(i.slug).sub*i.qty,0);sub.textContent=`Se te cobrarán ${nEur(subTotal)} cada 30, 45 o 60 días hasta que canceles. Puedes cancelar o saltar un envío desde el email de cada pedido.`;sub.hidden=false;}else{sub.hidden=true;}
  document.getElementById('paybtn').disabled=!t.items.length;
};
render();const orig=nCart.render.bind(nCart);nCart.render=()=>{orig();render();};
document.getElementById('applycode').onclick=async()=>{const c=document.getElementById('f-code').value.trim().toUpperCase();if(!c)return;const t=nCart.totals();try{const r=await fetch('/api/discount?code='+encodeURIComponent(c)+'&subtotal='+t.sub.toFixed(2));const d=await r.json();if(d&&!d.error){sessionStorage.setItem('n_disc',JSON.stringify({code:d.code,type:d.type,value:d.value}));nToast('Código aplicado');nTrack('apply_code',{code:d.code});}else nToast(d.error==='min_total'?`Este código pide un pedido mínimo de ${nEur(d.min_total)}`:d.error==='expired'?'Ese código ya ha caducado':d.error==='exhausted'?'Ese código ya se ha agotado':'Código no válido');}catch(e){nToast('No se pudo comprobar el código');}nCart.render();};
(()=>{let l={};try{l=JSON.parse(localStorage.getItem('n_lead')||'{}');}catch(e){}const d=JSON.parse(sessionStorage.getItem('n_disc')||'null');if(d&&d.code)document.getElementById('f-code').value=d.code;if(l.email&&!document.getElementById('f-email').value)document.getElementById('f-email').value=l.email;if(l.name&&!document.getElementById('f-name').value){const parts=l.name.split(' ');document.getElementById('f-name').value=parts[0];const ln=document.getElementById('f-last');if(ln&&parts.length>1)ln.value=parts.slice(1).join(' ');}if(l.phone&&!document.getElementById('f-phone').value)document.getElementById('f-phone').value=l.phone;})();
document.querySelectorAll('.n-methods label').forEach(l=>l.onclick=()=>{document.querySelectorAll('.n-methods label').forEach(x=>x.classList.remove('is-on'));l.classList.add('is-on');});
document.getElementById('bbarpay').onclick=()=>document.getElementById('cof').requestSubmit();
nTrack('checkout_view',{value:nCart.totals().total});
let started=false;document.getElementById('cof').addEventListener('input',()=>{if(!started){started=true;nTrack('checkout_start_form');}});
document.getElementById('cof').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);const t=nCart.totals();const btn=document.getElementById('paybtn');btn.disabled=true;btn.textContent='Conectando con la pasarela…';
  const utm=JSON.parse(sessionStorage.getItem('n_utm')||'{}');
  nTrack('add_payment_info',{pay:f.get('pay'),value:t.total});
  try{
    const r=await fetch('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:t.items,code:t.disc&&t.disc.code,email:f.get('email'),name:f.get('name')+' '+f.get('last'),address:{line:f.get('address'),zip:f.get('zip'),city:f.get('city'),country:f.get('country'),phone:f.get('phone')},pay:f.get('pay'),vid:sessionStorage.getItem('n_vid'),sid:localStorage.getItem('n_sid'),utm})});
    const j=await r.json();
    if(j.url){sessionStorage.setItem('n_lastorder',JSON.stringify({id:j.orderId,total:j.total,items:t.items}));location.href=j.url;}
    else{nToast(j.error||'Error al iniciar el pago');btn.disabled=false;btn.textContent='Pagar de forma segura';}
  }catch(err){nToast('No se pudo conectar. Inténtalo de nuevo.');btn.disabled=false;btn.textContent='Pagar de forma segura';}
};
});
</script>
</body>
</html>
