${p.faq.map(f=>`<details><summary>${f[0]}</summary><div class="n-acc__c"><div class="n-acc__in"><p>${f[1]}</p></div></div></details>`).join('')}

<figure class="n-quote n-reveal"><p class="n-stars" role="img" aria-label="5 sobre 5">★★★★★</p><blockquote>«Llegó en un día. El parche se adapta perfecto, no se mueve en toda la noche.»</blockquote><figcaption class="n-quote__who">Diego L. · Málaga <span class="n-lab n-lab--navy">Compra verificada</span></figcaption></figure>

<p style="text-align:center;margin-top:32px"><a class="n-link" href="/catalogo.html">Ver el catálogo completo</a></p>`;
