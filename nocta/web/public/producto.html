${isPlan?zoneHtml:`<div class="n-pd__seg" role="radiogroup" aria-label="Cómo lo quieres"><label class="is-on"><input type="radio" name="mode" value="one" checked><b>Una sola vez</b><span class="n-num">${eur(p.price)}</span></label><label class="n-pd__seg--sub"><input type="radio" name="mode" value="sub"><i class="n-pd__segflag">−${SUBPCT} % · Recomendado</i><b>${nSubName}</b><span class="n-num">${eur(p.sub)}</span></label></div>

<div class="n-pd__chips" aria-label="Garantías">${chips.map(c=>`<span>${c[0]}${c[1]}</span>`).join('')}</div>
<p class="n-pd__note"><a href="/garantia.html">Cómo funciona la garantía de 60 días</a> · Devolución sin abrir 14 días</p>
</div>`;
/* ---------- bloques inferiores ---------- */

<div class="n-ap__t"><span class="n-lab">Cómo se pone</span><h2>${isPatch?'Se pone en diez segundos.':'Dos minutos de rutina.'}</h2>
<ol class="n-ap__l">${p.how.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol></div></section>`:'';
const claims=`<section class="n-num5 n-pd__claims n-stagger n-reveal" aria-label="Cifras">${p.claims.map(c=>`<div class="n-c"><b class="n-num">${c[0]}</b><span>${c[1]}</span></div>`).join('')}</section>`;
const ed=VID?`<section class="n-c n-ed5 n-pd__ed n-reveal"><img src="/assets/img/resultado-manana.webp" width="720" height="540" alt="Parche de nariz NOCTA por la mañana, con la grasa absorbida de los poros" loading="lazy" decoding="async"><div class="n-ed5__t"><h2>Lo que sale en una noche.</h2><p>Todo lo que ves en el parche estaba dentro de tus poros. Se despega solo, sin tirones.</p></div></section>`:'';
const vt=(n,src,poster,t,s)=>`<div class="n-c n-vt5 n-reveal"><video src="${src}" poster="${poster}" muted loop playsinline preload="none" data-auto aria-label="${t}"></video><span class="n-vt5__l">${n}</span><div class="n-vt5__c"><b>${t}</b><span>${s}</span></div></div>`;
const videos=VID?`<section><div class="n-sh"><h2>Cómo se usa</h2><a href="/como-usar.html">Guía completa</a></div><div class="n-bento n-bento--3 n-stagger">${vt('01 · Ponlo','/assets/video/paso-1.mp4','/assets/img/paso-1.webp','Sobre la nariz seca','Curva en el puente, alas sobre las aletas.')}${vt('02 · Presiona','/assets/video/paso-2.mp4','/assets/img/paso-2.webp','20 segundos','El calor activa el adhesivo. Duerme.')}${vt('03 · Retira','/assets/video/paso-3.mp4','/assets/img/paso-3.webp','Por la mañana','Se despega solo. Y mira lo que trae.')}</div></section>`:'';
const spec=`<section class="n-c n-pd__spec n-pd__wrap n-reveal"><dl class="n-spec"><div><dt class="n-lab">Formato</dt><dd>${p.units}</dd></div>${pu?`<div><dt class="n-lab">Precio por ${/mascarilla/.test(pu)?'mascarilla':'parche'}</dt><dd class="n-num">${pu.split(' por ')[0]}</dd></div>`:''}${slug==='parches-nariz'?'<div><dt class="n-lab">Medidas</dt><dd class="n-num">60 × 45 mm · forma anatómica</dd></div>':''}<div><dt class="n-lab">Tiempo de uso</dt><dd>${use}</dd></div><div><dt class="n-lab">${isPatch?'Material':'Fórmula'}</dt><dd>${isPatch?'Hidrocoloide de grado hospitalario':'Coreana · sin perfume · sin alcohol'}</dd></div><div><dt class="n-lab">Origen</dt><dd>Fabricado en Corea para NOCTA</dd></div><div><dt class="n-lab">Referencia</dt><dd class="n-num">${p.sku||'—'}</dd></div></dl></section>`;
const DIST={'4.9':[90,8,2,0,0],'4.8':[86,10,3,1,0],'4.7':[82,12,4,1,1],'4.6':[78,14,5,2,1],'4.5':[74,16,6,3,1]};const dist=DIST[String(p.rating)]||DIST['4.7'];
const RV=(window.NOCTA_REVIEWS||{})[slug]||(window.NOCTA_REVIEWS||{})['parches-nariz']||[];
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const reviews=`<section id="opiniones"><div class="n-sh"><h2>Opiniones</h2><span class="n-lab">${p.reviews} compras verificadas</span></div>
<div class="n-c n-pd-rs n-reveal"><div class="n-pd-rs__big"><b>${String(p.rating).replace('.',',')}</b><span class="n-stars" aria-hidden="true">${stars(Math.round(p.rating))}</span><span>sobre 5<br>${p.reviews} opiniones</span></div><div class="n-pd-rs__bars" id="rbars">${dist.map((d,i)=>`<div><span class="n-num">${5-i}</span><i><b data-w="${d}"></b></i><span class="n-num">${d} %</span></div>`).join('')}</div></div>
<div class="n-rv5 n-stagger" style="margin-top:var(--n-gap)">${RV.map(r=>`<figure class="n-c n-reveal"><span class="n-stars" role="img" aria-label="${r[2]} sobre 5">${stars(r[2])}</span><blockquote>«${r[3]}»</blockquote><figcaption class="n-pd-rv__who"><span>${r[0]} · ${r[1]}</span><span class="n-pd-rv__v">${I.check}Compra verificada</span></figcaption></figure>`).join('')}</div></section>`;
const upsSec=ups.length?`<section id="pd-ups"><div class="n-sh"><h2>Completa tu rutina</h2><div class="n-rail__nav"></div></div><div class="n-rail n-stagger">${ups.map(u=>nCardR(u,{src:'pdp-upsell'})).join('')}</div></section>`:'';
document.getElementById('pdp').innerHTML=`<div class="n-pd">
<div class="n-pd__crumb"><a href="/catalogo.html">Catálogo</a><i></i><span>${nCat(p)}</span></div>
${gal}
<div class="n-pd__buy">${panel}${(isPack||isPlan)?incBlock():`<div id="pdpacks">${inPacks.slice(0,2).map(packBlock).join("")}</div>`}${planPromo}</div>
</div>
<div style="display:grid;gap:var(--n-gap);margin-top:var(--n-gap)">${ba}${motivos}${claims}${ap}${ed}${det}${videos}${spec}</div>
${reviews}${upsSec}
<p style="text-align:center;margin:32px 0 8px"><a class="n-btn" href="/catalogo.html">Ver el catálogo completo</a></p>`;
/* ---------- estado de compra ---------- */
let qty=1,sub=false;
const flash=el=>{el.classList.remove('n-pd__flash');void el.offsetWidth;el.classList.add('n-pd__flash');};
const setT=(sel,v)=>{const e=$(sel);if(e)e.textContent=v;};
const upd=()=>{const u=isPlan?p.price:nUnit(p,qty,sub);setT('#qv',qty);
  document.querySelectorAll('.n-tier').forEach(t=>{const n=+t.querySelector('input').value;const sp=t.querySelector('span.n-num');if(sp)sp.textContent=eur(nUnit(p,n,sub)*n);
    const sm=t.querySelector('.n-tier__u');if(sm&&n===1)sm.textContent=nPerUse(p,nUnit(p,1,sub))||p.units;});
  /* Lo que cuelga del precio y antes se quedaba clavado en el de compra única: el ahorro
     frente al precio tachado, el precio por parche y los plazos de Klarna. Con la mensualidad
     puesta se leía «29,52 €» junto a «Ahorras 12,05 €» y «o 3 × 12,30 €», que eran del otro modo.
     Los planes no pasan por aquí: su ahorro lo calcula el constructor de zonas. */
  if(!isPlan){
    const pux=nPerUse(p,u),eu=$('#pdpunit');if(eu)eu.textContent=p.units+(pux?' · '+pux:'')+' · IVA incluido';
    /* Sin flash() aquí: esa clase pone su propia `animation` y apagaba el brillo lento de la
       píldora de descuento, que es permanente. El precio de al lado ya parpadea. */
    const es=$('#pdpsave');if(es&&p.compare)es.textContent='Ahorras '+eur(p.compare-u);
    const ek=$('#pdpklarna');if(ek){const k=nKlarna(u);ek.innerHTML=k;ek.hidden=!k;}
  }document.querySelectorAll('.n-pd__seg label').forEach(l=>{const r=l.querySelector('input');const sp=l.querySelector('span.n-num');if(r&&sp)sp.textContent=eur(nUnit(p,qty,r.value==='sub')*qty);});setT('#addprice',eur(u*qty)+(isPlan?'/'+(p.plan.interval==='week'?'sem':'mes'):''));$('#pdpprice').innerHTML=eur(u)+nPlanSuf(p);flash($('#pdpprice'));flash($('#addprice'));setT('#st-price',eur(u*qty)+(isPlan?' '+p.plan.label:' · '+(qty>1?qty+' unidades':p.units)));setT('#buynote',isPlan?'Envío gratis incluido · sin permanencia':nNote(p,qty,sub));
  if(!isPlan)setT('#segnote',SEGNOTE(sub));
  document.querySelectorAll('#addbtn,#pdpexpress,#addcart,#st-add,#st-express .n-pay').forEach(b=>{b.dataset.qty=qty;b.dataset.sub=sub?1:0;});
  document.querySelectorAll('.n-tier').forEach(t=>t.classList.toggle('is-on',+t.querySelector('input').value===qty));};
document.querySelectorAll('input[name=qty]').forEach(r=>r.onchange=()=>{qty=+r.value;upd();nTrack('select_qty',{slug,qty});});
if($('#qm')){$('#qm').onclick=()=>{qty=Math.max(1,qty-1);upd();};$('#qp').onclick=()=>{qty=Math.min(10,qty+1);upd();};}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{sub=r.value==='sub';document.querySelectorAll('.n-pd__seg label').forEach(o=>o.classList.toggle('is-on',o.contains(r)));upd();nTrack('select_mode',{slug,sub});});
if(isPlan){const zbox=document.getElementById('zones');const applyPlan=st=>{document.querySelectorAll('#addbtn,#pdpexpress,#addcart,#st-add,#st-express .n-pay').forEach(b=>{b.dataset.opt=st.opt;});p.price=st.price;if(st.retail)p.compare=st.retail;upd();const pr=document.querySelector('.n-pd__price');if(pr){const sv=pr.querySelector('s');const sa=pr.querySelector('.n-pd__save');if(sv)sv.textContent=eur(st.retail);if(sa)sa.textContent='Ahorras '+eur(st.save);}
    const inc=document.querySelector('.n-pd-pk__list');if(inc){inc.innerHTML=st.slugs.map(sl=>{const c=nBySlug(sl);return c?`<li><img src="${foto(c)}" width="88" height="88" alt="" loading="lazy"><span><b>${c.name}</b><small>${c.units}${c.tags.includes('skincare')?' · skincare del mes':' · cada mes'}</small></span><s class="n-num">${eur(c.price)}</s></li>`:'';}).join('')+(p.gift?`<li class="gift"><span class="n-pd-pk__gi">${I.gift}</span><span><b>${p.gift}</b><small>Incluido</small></span><s class="n-num">3,75 €</s></li>`:'');}
    const pp=document.querySelector('.n-pd-pk__p');if(pp)pp.innerHTML=`<b class="n-num">${eur(st.price)}${nPlanSuf(p)}</b>${st.retail>st.price?`<s class="n-num">${eur(st.retail)}</s><span class="n-pd__save">Ahorras ${eur(st.save)}</span>`:''}`;};
  const bld=nPlanBuilder(zbox,p,{opt:p.plan.interval==='week'?'Nariz':undefined,onChange:applyPlan});setTimeout(()=>applyPlan(bld.state),0);}
const pc=$('.n-pd__packchip');if(pc)pc.onclick=e=>{e.preventDefault();const t=$('#pdpacks');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});nTrack('packchip',{slug});}};
$('#st-name').textContent=p.name;$('#st-img').src=nImg(p);$('#st-add').dataset.buy=slug;$('#st-express').innerHTML=nPay(slug,{src:'sticky'});upd();
const addc=$('#addcart');addc.addEventListener('click',()=>{const t=addc.textContent;addc.innerHTML=`${I.check} Añadido al carrito`;addc.classList.add('n-pd__ok');setTimeout(()=>{addc.textContent=t;addc.classList.remove('n-pd__ok');},1600);});
/* ---------- galería: contador, puntos, lightbox ---------- */
const track=$('#gtrack'),sl=[...track.children],dots=[...document.querySelectorAll('#gdots i')],cnt=$('#gcount');
const gprev=$('#gprev'),gnext=$('#gnext'),RMQ=matchMedia('(prefers-reduced-motion:reduce)');
let gi=0;
/* El carril es el mismo en móvil y en escritorio (una foto por pantalla, con arrastre y snap).
   En escritorio, además, las flechas: así se cambia de foto sin bajar la rueda y sin perder de
   vista el panel de compra. El observador mantiene el estado aunque se pase la foto a mano. */
const marca=i=>{gi=i;dots.forEach((d,j)=>d.classList.toggle('is-on',j===i));cnt.textContent=(i+1)+'/'+sl.length;
  gprev.setAttribute('aria-disabled',i<=0);gnext.setAttribute('aria-disabled',i>=sl.length-1);};
const vaA=i=>{i=Math.max(0,Math.min(sl.length-1,i));if(i===gi)return;
  track.scrollTo({left:sl[i].offsetLeft-sl[0].offsetLeft,behavior:RMQ.matches?'auto':'smooth'});marca(i);nTrack('gallery_nav',{slug,i});};
const gio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;marca(sl.indexOf(e.target));}),{root:track,threshold:.6});sl.forEach(s=>gio.observe(s));
gprev.onclick=()=>vaA(gi-1);gnext.onclick=()=>vaA(gi+1);marca(0);
$('#gal').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();vaA(gi+(e.key==='ArrowRight'?1:-1));});
const lb=$('#lb'),lbt=$('#lb-track'),lbc=$('#lb-count');let lbBuilt=false,lastFocus=null;
const buildLb=()=>{if(lbBuilt)return;lbBuilt=true;lbt.innerHTML=slides.map(s=>s.t==='video'?`<div class="n-pd-lb__s"><video src="${s.src}" poster="${s.poster}" muted loop playsinline controls preload="none"></video></div>`:`<div class="n-pd-lb__s"><img src="${s.src}" ${dim(s.src)} alt="${s.alt||''}" loading="lazy" decoding="async"></div>`).join('');
  const ls=[...lbt.children];const lio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)lbc.textContent=(ls.indexOf(e.target)+1)+'/'+ls.length;}),{root:lbt,threshold:.6});ls.forEach(x=>lio.observe(x));
  $('#lb-prev').innerHTML=I.chevL;$('#lb-next').innerHTML=I.chevR;
  $('#lb-prev').onclick=()=>lbt.scrollBy({left:-lbt.clientWidth,behavior:'smooth'});$('#lb-next').onclick=()=>lbt.scrollBy({left:lbt.clientWidth,behavior:'smooth'});};
const openLb=i=>{buildLb();lastFocus=document.activeElement;lb.hidden=false;lb.classList.add('is-open');document.body.classList.add('n-pd-locked');requestAnimationFrame(()=>{lbt.scrollTo({left:lbt.clientWidth*i,behavior:'instant'});$('#lb-close').focus();});nTrack('view_gallery',{slug,i});};
const closeLb=()=>{lb.classList.remove('is-open');lb.hidden=true;document.body.classList.remove('n-pd-locked');lbt.querySelectorAll('video').forEach(v=>v.pause());if(lastFocus)lastFocus.focus();};
sl.forEach(s=>{if(s.classList.contains('is-video'))return;s.addEventListener('click',()=>openLb(+s.dataset.i));s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb(+s.dataset.i);}});});
$('#lb-close').onclick=closeLb;document.addEventListener('keydown',e=>{if(!lb.hidden&&e.key==='Escape')closeLb();});
/* ---------- barras de opiniones, carril, medios ---------- */
const bars=$('#rbars');new IntersectionObserver((es,o)=>{es.forEach(e=>{if(!e.isIntersecting)return;bars.querySelectorAll('b[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');o.disconnect();});},{threshold:.4}).observe(bars);
const upsEl=$('#pd-ups');if(upsEl)nRail(upsEl);
nMedia();nReveal();
/* ---------- JSON-LD ---------- */
const ld={"@context":"https://schema.org","@type":"Product",name:p.name,sku:p.sku,description:p.desc,image:location.origin+main,brand:{"@type":"Brand",name:"NOCTA"},aggregateRating:{"@type":"AggregateRating",ratingValue:p.rating,reviewCount:p.reviews},review:RV.map(r=>({"@type":"Review",author:{"@type":"Person",name:r[0]},reviewRating:{"@type":"Rating",ratingValue:r[2]},reviewBody:r[3]})),offers:{"@type":"Offer",priceCurrency:"EUR",price:p.price,availability:"https://schema.org/InStock",url:location.href}};
const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s);
nTrack('view_item',{slug,value:p.price});
});
</script>
</body>
