const flash=el=>{el.classList.remove('n-pd__flash');void el.offsetWidth;el.classList.add('n-pd__flash');};
const setT=(sel,v)=>{const e=$(sel);if(e)e.textContent=v;};
const upd=()=>{const u=isPlan?p.price:(sub?p.sub:p.price);setT('#qv',qty);setT('#addprice',eur(u*qty)+(isPlan?'/'+(p.plan.interval==='week'?'sem':'mes'):''));$('#pdpprice').innerHTML=eur(u)+nPlanSuf(p);flash($('#pdpprice'));flash($('#addprice'));setT('#st-price',eur(u*qty)+(isPlan?' '+p.plan.label:' · '+(qty>1?qty+' unidades':p.units)));setT('#buynote',isPlan?'Envío gratis incluido · sin permanencia':nNote(p,qty,sub));
  if(!isPlan)setT('#segnote',sub?'Cada 30 días. Cancela o salta un envío desde el email de cada pedido.':'Sin compromiso. Puedes pasarte a suscripción cuando quieras.');
  document.querySelectorAll('#addbtn,#pdpexpress,#addcart,#st-add,#st-express .n-pay').forEach(b=>{b.dataset.qty=qty;b.dataset.sub=sub?1:0;});
  document.querySelectorAll('.n-tier').forEach(t=>t.classList.toggle('is-on',+t.querySelector('input').value===qty));};
document.querySelectorAll('input[name=qty]').forEach(r=>r.onchange=()=>{qty=+r.value;upd();nTrack('select_qty',{slug,qty});});
if($('#qm')){$('#qm').onclick=()=>{qty=Math.max(1,qty-1);upd();};$('#qp').onclick=()=>{qty=Math.min(10,qty+1);upd();};}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{sub=r.value==='sub';document.querySelectorAll('.n-pd__seg label').forEach(o=>o.classList.toggle('is-on',o.contains(r)));upd();nTrack('select_mode',{slug,sub});});
if(isPlan){const sel=()=>[...document.querySelectorAll('#zones button.is-on')].map(b=>b.dataset.z).join(' + ');const applyOpt=()=>{const o=sel();document.querySelectorAll('#addbtn,#pdpexpress,#addcart,#st-add,#st-express .n-pay').forEach(b=>{b.dataset.opt=o;});};
  document.querySelectorAll('#zones button').forEach(b=>b.addEventListener('click',()=>{const on=[...document.querySelectorAll('#zones button.is-on')];if(p.plan.interval==='week'){on.forEach(x=>{x.classList.remove('is-on');x.setAttribute('aria-pressed','false');});b.classList.add('is-on');b.setAttribute('aria-pressed','true');}else{if(b.classList.contains('is-on')){if(on.length>1){b.classList.remove('is-on');b.setAttribute('aria-pressed','false');}}else{if(on.length>=2){on[0].classList.remove('is-on');on[0].setAttribute('aria-pressed','false');}b.classList.add('is-on');b.setAttribute('aria-pressed','true');}}applyOpt();nTrack('plan_zone',{plan:slug,z:sel()});}));
  setTimeout(applyOpt,0);}
const pc=$('.n-pd__packchip');if(pc)pc.onclick=e=>{e.preventDefault();const t=$('#pdpacks');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});nTrack('packchip',{slug});}};
$('#st-name').textContent=p.name;$('#st-img').src=nImg(p);$('#st-add').dataset.buy=slug;$('#st-express').innerHTML=nPay(slug,{src:'sticky'});upd();
const addc=$('#addcart');addc.addEventListener('click',()=>{const t=addc.textContent;addc.innerHTML=`${I.check} Añadido al carrito`;addc.classList.add('n-pd__ok');setTimeout(()=>{addc.textContent=t;addc.classList.remove('n-pd__ok');},1600);});
/* ---------- galería: contador, puntos, lightbox ---------- */
const track=$('#gtrack'),sl=[...track.children],dots=[...document.querySelectorAll('#gdots i')],cnt=$('#gcount');
const gio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const i=sl.indexOf(e.target);dots.forEach((d,j)=>d.classList.toggle('is-on',j===i));cnt.textContent=(i+1)+'/'+sl.length;}),{root:track,threshold:.6});sl.forEach(s=>gio.observe(s));
const lb=$('#lb'),lbt=$('#lb-track'),lbc=$('#lb-count');let lbBuilt=false,lastFocus=null;
const buildLb=()=>{if(lbBuilt)return;lbBuilt=true;lbt.innerHTML=slides.map(s=>s.t==='video'?`<div class="n-pd-lb__s"><video src="${s.src}" poster="${s.poster}" muted loop playsinline controls preload="none"></video></div>`:`<div class="n-pd-lb__s"><img src="${s.src}" ${dim(s.src)} alt="${s.alt||''}" loading="lazy" decoding="async"></div>`).join('');
  const ls=[...lbt.children];const lio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)lbc.textContent=(ls.indexOf(e.target)+1)+'/'+ls.length;}),{root:lbt,threshold:.6});ls.forEach(x=>lio.observe(x));
  $('#lb-prev').innerHTML=I.chevL;$('#lb-next').innerHTML=I.chevR;
  $('#lb-prev').onclick=()=>lbt.scrollBy({left:-lbt.clientWidth,behavior:'smooth'});$('#lb-next').onclick=()=>lbt.scrollBy({left:lbt.clientWidth,behavior:'smooth'});};
const openLb=i=>{buildLb();lastFocus=document.activeElement;lb.hidden=false;lb.classList.add('is-open');document.body.classList.add('n-pd-locked');requestAnimationFrame(()=>{lbt.scrollTo({left:lbt.clientWidth*i,behavior:'instant'});$('#lb-close').focus();});nTrack('view_gallery',{slug,i});};
const closeLb=()=>{lb.classList.remove('is-open');lb.hidden=true;document.body.classList.remove('n-pd-locked');lbt.querySelectorAll('video').forEach(v=>v.pause());if(lastFocus)lastFocus.focus();};
sl.forEach(s=>{if(s.classList.contains('is-video'))return;s.addEventListener('click',()=>openLb(+s.dataset.i));s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb(+s.dataset.i);}});});
$('#lb-close').onclick=closeLb;document.addEventListener('keydown',e=>{if(!lb.hidden&&e.key==='Escape')closeLb();});
/* ---------- barras de opiniones, carril, medios ---------- */
const bars=$('#rbars');new IntersectionObserver((es,o)=>{es.forEach(e=>{if(!e.isIntersecting)return;bars.querySelectorAll('b[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');o.disconnect();});},{threshold:.4}).observe(bars);
const upsEl=$('#pd-ups');if(upsEl)nRail(upsEl);
nMedia();nReveal();
/* ---------- JSON-LD ---------- */
const ld={"@context":"https://schema.org","@type":"Product",name:p.name,sku:p.sku,description:p.desc,image:location.origin+main,brand:{"@type":"Brand",name:"NOCTA"},aggregateRating:{"@type":"AggregateRating",ratingValue:p.rating,reviewCount:p.reviews},review:RV.map(r=>({"@type":"Review",author:{"@type":"Person",name:r[0]},reviewRating:{"@type":"Rating",ratingValue:r[2]},reviewBody:r[3]})),offers:{"@type":"Offer",priceCurrency:"EUR",price:p.price,availability:"https://schema.org/InStock",url:location.href}};
const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s);
nTrack('view_item',{slug,value:p.price});
});
</script>
</body>
