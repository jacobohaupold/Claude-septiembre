<div class="n-bento n-bento--2c n-stagger" id="grid-catalogo"><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article><article class="n-pc n-sk" aria-hidden="true"><span class="n-pc__w"></span><span class="n-pc__i"></span></article></div>

    <p class="n-lead" style="margin:0 auto 16px">¿No sabes por dónde empezar?</p>
    <a class="n-btn n-btn--ghost" href="/quiz.html">Hacer el test de piel</a>
    <p style="margin-top:14px"><a class="n-link" href="/no-son-puntos-negros.html">O mira por qué vuelven los puntos negros</a></p>

<div id="site-footer"></div>
<script src="/assets/js/photos.js?v=202609081753"></script>
<script src="/assets/js/products.js?v=202609081753"></script><script src="/api/catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const P=window.NOCTA_PRODUCTS;
  const grid=document.getElementById('grid-catalogo');
  const cat=p=>p.bundle?'packs':(p.tags.includes('skincare')?'skincare':'parches');
  grid.innerHTML=P.map(p=>nCardR(p,{src:"catalogo"})).join('');
  const cards=[...grid.children];
  const count=document.getElementById('count');
  document.getElementById('chips').addEventListener('click',e=>{
    const b=e.target.closest('.n-chip'); if(!b) return;
    document.querySelectorAll('.n-chip').forEach(c=>{c.classList.remove('is-on');c.setAttribute('aria-pressed','false');});
    b.classList.add('is-on');b.setAttribute('aria-pressed','true');
    const f=b.dataset.f;let n=0;
    cards.forEach((c,i)=>{const p=P[i];const show=f==='todos'||cat(p)===f;c.hidden=!show;if(show)n++;});
    count.textContent=n+' producto'+(n===1?'':'s');
    nTrack('filter_catalogo',{f});
    nReveal();
  });
  nReveal();
});
</script>
</body>
</html>
